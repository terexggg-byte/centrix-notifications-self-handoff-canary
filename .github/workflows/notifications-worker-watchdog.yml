name: Notifications Emergency Recovery Watchdog

on:
  workflow_dispatch:
    inputs:
      trigger:
        description: Orchestration trigger only; PostgreSQL remains the leadership authority
        required: false
        default: manual
        type: choice
        options:
          - manual
          - schedule
  schedule:
    - cron: "7,22,37,52 * * * *"

permissions:
  actions: write
  contents: read

concurrency:
  group: notifications-worker-watchdog
  cancel-in-progress: false

jobs:
  dispatch-scheduled-watchdog:
    if: github.event_name == 'schedule' && vars.PRODUCTION_EMERGENCY_WATCHDOG_ARMED == 'true'
    name: Dispatch protected-branch watchdog evaluation
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Dispatch watchdog on the approved Recovery branch
        env:
          GH_TOKEN: ${{ github.token }}
        run: >-
          gh workflow run notifications-worker-watchdog.yml
          --repo "${{ github.repository }}"
          --ref codex/notifications-production-recovery
          -f trigger=schedule

  watchdog:
    if: github.event_name == 'workflow_dispatch' && vars.PRODUCTION_EMERGENCY_WATCHDOG_ARMED == 'true'
    name: Recover a missing notifications worker session
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment: production-emergency
    env:
      RELEASE_SHA: 2c920190719a4d6634ecfdc809817d5905d1a2d7
      GH_TOKEN: ${{ github.token }}
      DATABASE_URL: ${{ secrets.PRODUCTION_DATABASE_URL }}
      NOTIFICATIONS_WORKER_LEASE_ID: notifications-worker
      NOTIFICATIONS_WORKER_INSTANCE_LABEL: github-actions
      SELF_HANDOFF_WORKFLOW_FILE: notifications-worker-self-handoff.yml
      SELF_HANDOFF_WORKFLOW_REF: codex/notifications-production-recovery
      WATCHDOG_CANDIDATE_FRESHNESS_MS: "1200000"

    steps:
      - name: Checkout orchestration repository
        uses: actions/checkout@v4
        with:
          ref: codex/notifications-production-recovery
          persist-credentials: false

      - name: Check required configuration
        shell: bash
        run: |
          test -n "$DATABASE_URL"
          test -n "$SELF_HANDOFF_WORKFLOW_REF"

      - name: Ensure PostgreSQL client exists
        shell: bash
        run: |
          if ! command -v psql >/dev/null 2>&1; then
            sudo apt-get update
            sudo apt-get install --yes postgresql-client
          fi
          psql --version

      - name: Evaluate PostgreSQL lease and recover if required
        run: node scripts/notifications-self-handoff.mjs watchdog
