name: Notifications Canary Recovery Watchdog

on:
  workflow_dispatch:
    inputs:
      observe_recovery:
        description: Canary-only observer for one watchdog-dispatched recovery owner
        required: false
        default: false
        type: boolean

permissions:
  actions: write
  contents: read

concurrency:
  group: notifications-worker-watchdog
  cancel-in-progress: false

jobs:
  watchdog:
    name: Recover a missing notifications worker session
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      RELEASE_SHA: 2c920190719a4d6634ecfdc809817d5905d1a2d7
      GH_TOKEN: ${{ github.token }}
      DATABASE_URL: ${{ secrets.CANARY_DATABASE_URL }}
      NOTIFICATIONS_WORKER_LEASE_ID: notifications-worker
      NOTIFICATIONS_WORKER_INSTANCE_LABEL: github-actions
      SELF_HANDOFF_WORKFLOW_FILE: notifications-worker-self-handoff.yml
      SELF_HANDOFF_WORKFLOW_REF: codex/notifications-emergency-recovery
      WATCHDOG_CANDIDATE_FRESHNESS_MS: "30000"
      WATCHDOG_HANDOFFS_REMAINING: "0"

    steps:
      - name: Checkout orchestration repository
        uses: actions/checkout@v4
        with:
          ref: codex/notifications-emergency-recovery
          persist-credentials: false

      - name: Check required configuration
        shell: bash
        run: |
          test -n "$DATABASE_URL"
          test -n "$SELF_HANDOFF_WORKFLOW_REF"

      - name: Ensure PostgreSQL client exists
        shell: bash
        run: |
          if ! command -v psql >/dev/null 2>&1; then
            sudo apt-get update
            sudo apt-get install --yes postgresql-client
          fi
          psql --version

      - name: Evaluate PostgreSQL lease and recover if required
        run: node scripts/notifications-self-handoff.mjs watchdog

      - name: Observe watchdog recovery lease
        if: ${{ inputs.observe_recovery }}
        env:
          SELF_HANDOFF_OBSERVER_OUTPUT: ${{ runner.temp }}/notifications-watchdog-recovery.jsonl
          SELF_HANDOFF_OBSERVER_EXPECTED_OWNERS: "1"
          SELF_HANDOFF_OBSERVER_EXPECTED_HEARTBEATS: "3"
          SELF_HANDOFF_OBSERVER_POLL_MS: "2000"
          SELF_HANDOFF_OBSERVER_TIMEOUT_MS: "900000"
        run: node scripts/notifications-self-handoff.mjs observer

      - name: Upload watchdog recovery evidence
        if: ${{ always() && inputs.observe_recovery }}
        uses: actions/upload-artifact@v4
        with:
          name: notifications-watchdog-recovery-${{ github.run_id }}
          path: ${{ runner.temp }}/notifications-watchdog-recovery.jsonl
          if-no-files-found: error
          retention-days: 7
