name: Notifications Emergency Recovery Session

run-name: Notifications session / ${{ inputs.trigger || 'manual' }} / ${{ inputs.session_id || github.run_id }}

on:
  workflow_dispatch:
    inputs:
      trigger:
        description: Orchestration trigger only; PostgreSQL remains the leadership authority
        required: true
        default: manual
        type: choice
        options:
          - manual
          - bootstrap
          - handoff
          - watchdog
      session_id:
        description: Unique orchestration session identifier
        required: false
        type: string
      predecessor_run_id:
        description: Predecessor GitHub run identifier for traceability only
        required: false
        type: string
      handoffs_remaining:
        description: Number of remaining handoffs, or unlimited for emergency recovery
        required: false
        default: unlimited
        type: string
      handoff_prepare_after_minutes:
        description: Canary-only delay before preparing the successor
        required: false
        default: 3
        type: number
      graceful_shutdown_after_minutes:
        description: Canary-only target for graceful shutdown
        required: false
        default: 5
        type: number
      max_runtime_minutes:
        description: Canary-only hard session boundary
        required: false
        default: 8
        type: number
      inject_crash:
        description: Canary-only controlled crash after the configured renewals
        required: false
        default: false
        type: boolean
      inject_db_failure:
        description: Canary-only unreachable PostgreSQL proof; no worker is started
        required: false
        default: false
        type: boolean
      inject_github_api_failure:
        description: Canary-only unreachable GitHub API during handoff
        required: false
        default: false
        type: boolean
      observer_expected_owners:
        description: Canary-only number of lease owners the observer must prove
        required: false
        default: 2
        type: number
      observer_expected_heartbeats:
        description: Canary-only heartbeat samples required for every owner
        required: false
        default: 4
        type: number
      crash_after_renewals:
        description: Number of successful PostgreSQL renewals before the controlled crash
        required: false
        default: 3
        type: number

permissions:
  actions: write
  contents: read

jobs:
  worker-session:
    name: Run immutable Centrix notifications worker session
    runs-on: ubuntu-latest
    timeout-minutes: 350
    env:
      RELEASE_SHA: 2c920190719a4d6634ecfdc809817d5905d1a2d7
      CENTRIX_RC_DIR: ${{ github.workspace }}/centrix-rc
      GH_TOKEN: ${{ github.token }}
      SELF_HANDOFF_WORKFLOW_FILE: notifications-worker-self-handoff.yml
      SELF_HANDOFF_WORKFLOW_REF: ${{ github.ref_name }}
      SELF_HANDOFF_ORCHESTRATOR_SHA: ${{ github.sha }}
      SELF_HANDOFF_REMAINING: ${{ inputs.handoffs_remaining || 'unlimited' }}
      SELF_HANDOFF_START_MINUTES: ${{ inputs.handoff_prepare_after_minutes }}
      SELF_HANDOFF_TARGET_MINUTES: ${{ inputs.graceful_shutdown_after_minutes }}
      SELF_HANDOFF_MAX_MINUTES: ${{ inputs.max_runtime_minutes }}
      SELF_HANDOFF_READINESS_TIMEOUT_MS: "1500000"
      SELF_HANDOFF_GATE_TIMEOUT_MS: "1500000"
      SELF_HANDOFF_GRACEFUL_TIMEOUT_MS: "300000"
      SELF_HANDOFF_INJECT_CRASH: ${{ inputs.inject_crash }}
      SELF_HANDOFF_CRASH_AFTER_RENEWALS: ${{ inputs.crash_after_renewals }}
      CANARY_ALLOW_ACTIVE_PREDECESSOR: ${{ inputs.trigger == 'handoff' }}
      DATABASE_URL: ${{ secrets.CANARY_DATABASE_URL }}
      WHATSAPP_AUTH_ENCRYPTION_KEY: ${{ secrets.CANARY_WHATSAPP_AUTH_ENCRYPTION_KEY }}
      WEB_PUSH_VAPID_PUBLIC_KEY: ${{ secrets.CANARY_WEB_PUSH_VAPID_PUBLIC_KEY }}
      WEB_PUSH_VAPID_PRIVATE_KEY: ${{ secrets.CANARY_WEB_PUSH_VAPID_PRIVATE_KEY }}
      WEB_PUSH_VAPID_SUBJECT: mailto:centrix-canary@example.invalid
      DATA_SOURCE: prisma
      NODE_ENV: production
      NOTIFICATIONS_WORKER_LOG_LEVEL: info
      NOTIFICATIONS_WORKER_HA_ENABLED: "true"
      NOTIFICATIONS_WORKER_ROLE: primary
      NOTIFICATIONS_WORKER_INSTANCE_ID: gha-${{ github.run_id }}-${{ github.run_attempt }}
      NOTIFICATIONS_WORKER_INSTANCE_LABEL: github-actions
      NOTIFICATIONS_WORKER_PREFERRED_LABEL: github-actions
      NOTIFICATIONS_WORKER_PREFERRED_PREEMPTION_ENABLED: "false"
      NOTIFICATIONS_WORKER_STANDBY_ONLY: "false"
      NOTIFICATIONS_WORKER_LEASE_TTL_MS: "45000"
      NOTIFICATIONS_WORKER_LEASE_RENEW_MS: "10000"
      NOTIFICATIONS_WORKER_TRAFFIC_NOT_BEFORE: "2099-01-01T00:00:00.000Z"
      CARD_EXPORT_WORKER_ENABLED: "false"

    steps:
      - name: Checkout orchestration repository
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Check required configuration
        env:
          CENTER_MANAGEMENT_RC_DEPLOY_KEY: ${{ secrets.CENTER_MANAGEMENT_RC_DEPLOY_KEY }}
        shell: bash
        run: |
          test -n "$DATABASE_URL"
          test -n "$WHATSAPP_AUTH_ENCRYPTION_KEY"
          test -n "$WEB_PUSH_VAPID_PUBLIC_KEY"
          test -n "$WEB_PUSH_VAPID_PRIVATE_KEY"
          test -n "$WEB_PUSH_VAPID_SUBJECT"
          test -n "$NOTIFICATIONS_WORKER_TRAFFIC_NOT_BEFORE"
          test -n "$CENTER_MANAGEMENT_RC_DEPLOY_KEY"

      - name: Checkout immutable Centrix RC
        uses: actions/checkout@v4
        with:
          repository: terexggg-byte/center-management-system-prod
          ref: 2c920190719a4d6634ecfdc809817d5905d1a2d7
          ssh-key: ${{ secrets.CENTER_MANAGEMENT_RC_DEPLOY_KEY }}
          persist-credentials: false
          path: centrix-rc

      - name: Verify immutable Centrix release
        shell: bash
        run: test "$(git -C "$CENTRIX_RC_DIR" rev-parse HEAD)" = "$RELEASE_SHA"

      - name: Setup Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: "20.20.2"
          cache: npm
          cache-dependency-path: centrix-rc/package-lock.json

      - name: Install immutable release dependencies
        working-directory: centrix-rc
        run: npm ci

      - name: Test worker runtime
        working-directory: centrix-rc
        run: npm run test:notifications-worker

      - name: Generate Prisma client
        working-directory: centrix-rc
        run: npm run prisma:generate

      - name: Ensure PostgreSQL client exists
        shell: bash
        run: |
          if ! command -v psql >/dev/null 2>&1; then
            sudo apt-get update
            sudo apt-get install --yes postgresql-client
          fi
          psql --version

      - name: Verify isolated Canary preflight
        if: ${{ !inputs.inject_db_failure }}
        run: node scripts/notifications-self-handoff.mjs canary-preflight

      - name: Prove PostgreSQL outage fails closed
        if: ${{ inputs.inject_db_failure }}
        env:
          DATABASE_URL: postgresql://canary-invalid@127.0.0.1:9/canary?connect_timeout=1
        shell: bash
        run: |
          if node scripts/notifications-self-handoff.mjs canary-preflight; then
            echo "Canary DB failure injection unexpectedly reached PostgreSQL." >&2
            exit 1
          fi
          echo '{"event":"canary.db_failure_fail_closed","passed":true}'

      - name: Wait for predecessor lease expiration
        if: ${{ !inputs.inject_db_failure }}
        run: node scripts/notifications-self-handoff.mjs gate

      - name: Run self-handoff worker session
        if: ${{ !inputs.inject_db_failure }}
        env:
          GITHUB_API_URL: ${{ inputs.inject_github_api_failure && 'https://127.0.0.1:9' || github.api_url }}
        run: node scripts/notifications-self-handoff.mjs session

  canary-observer:
    name: Observe PostgreSQL lease transitions without granting leadership
    if: inputs.trigger == 'manual' && !inputs.inject_db_failure
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      RELEASE_SHA: 2c920190719a4d6634ecfdc809817d5905d1a2d7
      DATABASE_URL: ${{ secrets.CANARY_DATABASE_URL }}
      SELF_HANDOFF_OBSERVER_POLL_MS: "2000"
      SELF_HANDOFF_OBSERVER_TIMEOUT_MS: "1500000"
      SELF_HANDOFF_OBSERVER_EXPECTED_OWNERS: ${{ inputs.observer_expected_owners }}
      SELF_HANDOFF_OBSERVER_EXPECTED_HEARTBEATS: ${{ inputs.observer_expected_heartbeats }}

    steps:
      - name: Checkout orchestration repository
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Ensure PostgreSQL client exists
        shell: bash
        run: |
          if ! command -v psql >/dev/null 2>&1; then
            sudo apt-get update
            sudo apt-get install --yes postgresql-client
          fi
          psql --version

      - name: Observe PostgreSQL server-time leadership
        env:
          SELF_HANDOFF_OBSERVER_OUTPUT: ${{ runner.temp }}/notifications-self-handoff-canary.jsonl
        run: node scripts/notifications-self-handoff.mjs observer

      - name: Upload Canary evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: notifications-self-handoff-canary-${{ github.run_id }}
          path: ${{ runner.temp }}/notifications-self-handoff-canary.jsonl
          if-no-files-found: error
          retention-days: 7
